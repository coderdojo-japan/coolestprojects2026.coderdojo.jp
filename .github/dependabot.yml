# GitHub Actions の更新を Dependabot に追跡させる設定。
#
# 未設置だったため actions/checkout が v2 / v3 のまま残っていた。
# 以降は Dependabot が更新 PR を出すので、同じ形の陳腐化を防げる。
#
# NOTE: gem のセキュリティ更新は設定ファイル不要で動くため、
#       ここに bundler を足さなくても既存の挙動は変わらない。
#
# 姉妹リポジトリ coderdojo.jp の同名ファイルと揃えている。
# 経緯は同リポジトリの PR #1837 を参照。
# https://github.com/coderdojo-japan/coderdojo.jp/pull/1837
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "Bump"
