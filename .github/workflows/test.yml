name: Test & Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

# GITHUB_TOKEN は checkout にしか使わないので、読み取りだけにする（Pages へ配るジョブは、自分で権限を書いている）
permissions:
  contents: read

jobs:
  # Test job is always triggered as continuous integration
  test:
    runs-on: ubuntu-latest
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 🔧 Build & Test
      run: |
        JEKYLL_ENV=production bundle exec jekyll build
        JEKYLL_ENV=production bundle exec jekyll doctor
        SKIP_BUILD=true       bundle exec rake test

  # Deploy job is triggered only pushed to main branch && CI passed
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: 🔧 Build
      run: |
        JEKYLL_ENV=production bundle exec jekyll build

    #- name: 🤖 Generate individual pages by projects.yml data
    #  run: |
    #    bundle exec rake upsert_project_pages_by_data
    #    if [ -n "$(git status ./_pages --porcelain)" ]; then
    #      if ( ruby -ryaml -e "p YAML.unsafe_load(STDIN.read)" < _data/projects.yml > /dev/null ); then
    #        # デフォルトでは内情に詳しい @yasulab としていますが、適宜ユーザー名を変えてください。
    #        git config --global user.name  "yasulab"
    #        git config --global user.email "yohei@yasslab.jp"
    #        git checkout main
    #        git add _pages/exhibition
    #        git add Gemfile.lock
    #        git commit -m '🤖 Upsert project page(s) by GitHub Actions'
    #        git push origin main
    #      else
    #        echo "Detect syntax error in '_data/projects.yml' file, check its syntax."
    #      fi
    #    fi

    # 公式の Pages の action で配る。以前は第三者の peaceiris/actions-gh-pages に書き込みのトークンを渡し、
    # gh-pages ブランチへ push していた。ここではビルドした _site を成果物として上げ、下の pages ジョブが配る
    - name: 📦 Upload site for GitHub Pages
      if:   github.ref == 'refs/heads/main' && job.status == 'success'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./_site

  pages:
    name: 🚀 Deploy to GitHub Pages
    needs: deploy
    if:   github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ほかの回の配布と重ならないよう、Pages への配布は 1 つずつ動かす
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages:    write  # Pages に配る
      id-token: write  # 配布元がこの workflow であることを確かめる
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
    - id:   deployment
      uses: actions/deploy-pages@v5
